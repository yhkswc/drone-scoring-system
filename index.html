    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- Firebase 雲端資料庫模組 (HTML 必須使用 CDN 網址) ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // === 你的 Firebase 專屬設定 ===
        const firebaseConfig = {
          apiKey: "AIzaSyC4QmmvtkdLhS137PM0P7JI8p5GzPp-bgU",
          authDomain: "drone-scoring-system.firebaseapp.com",
          databaseURL: "https://drone-scoring-system-default-rtdb.firebaseio.com",
          projectId: "drone-scoring-system",
          storageBucket: "drone-scoring-system.firebasestorage.app",
          messagingSenderId: "206842095067",
          appId: "1:206842095067:web:2f58c34212aeeaea0673fe",
          measurementId: "G-JEFZPEDTCV"
        };
        // ===========================================

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (error) {
            console.error("Firebase 初始化失敗:", error);
        }

        // --- 圖示載入器 ---
        const IconSVG = ({ children, className = "w-5 h-5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );
        const Plane = (p) => <IconSVG {...p}><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-.5-.5-2.5 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.2-1.1.5l-1.3 2.6c-.2.4-.1.9.3 1.1L8 13l-4 4-2.5-.5c-.4-.1-.8.2-1 .6L.2 18.5c-.2.4 0 .8.3 1l4 1.5 1.5 4c.2.3.6.5 1 .3l1.4-1.3c.4-.2.7-.6.6-1l-.5-2.5 4-4 2.6 5.3c.2.4.7.5 1.1.3l2.6-1.3c.3-.2.6-.6.5-1.1z"/></IconSVG>;
        const AlertCircle = (p) => <IconSVG {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></IconSVG>;
        const Trophy = (p) => <IconSVG {...p}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></IconSVG>;
        const History = (p) => <IconSVG {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></IconSVG>;
        const User = (p) => <IconSVG {...p}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></IconSVG>;
        const Check = (p) => <IconSVG {...p}><polyline points="20 6 9 17 4 12"/></IconSVG>;
        const BarChart3 = (p) => <IconSVG {...p}><path d="M3 3v18h18"/><rect x="7" y="10" width="4" height="7" rx="1"/><rect x="15" y="4" width="4" height="13" rx="1"/></IconSVG>;
        const RefreshCw = (p) => <IconSVG {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></IconSVG>;
        const Plus = (p) => <IconSVG {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></IconSVG>;
        const Minus = (p) => <IconSVG {...p}><line x1="5" y1="12" x2="19" y2="12"/></IconSVG>;
        const Calendar = (p) => <IconSVG {...p}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></IconSVG>;
        const ChevronDown = (p) => <IconSVG {...p}><polyline points="6 9 12 15 18 9"/></IconSVG>;
        const Medal = (p) => <IconSVG {...p}><path d="M7.21 15 2.66 7.14a2 2 0 0 1 .13-2.2L4.4 2.8A2 2 0 0 1 6 2h12a2 2 0 0 1 1.6.8l1.6 2.14a2 2 0 0 1 .14 2.2L16.79 15"/><path d="M11 12 5.12 2.2"/><path d="m13 12 5.88-9.8"/><path d="M8 7h8"/><circle cx="12" cy="17" r="5"/><polyline points="12 18 10.5 16.5 12 15 13.5 16.5 12 18"/></IconSVG>;
        const ListOrdered = (p) => <IconSVG {...p}><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></IconSVG>;
        const Trash2 = (p) => <IconSVG {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></IconSVG>;
        const X = (p) => <IconSVG {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconSVG>;
        const BarChart2 = (p) => <IconSVG {...p}><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></IconSVG>;
        const LayoutList = (p) => <IconSVG {...p}><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="3" y="3" width="7" height="7" rx="1"/><line x1="14" y1="4" x2="21" y2="4"/><line x1="14" y1="9" x2="21" y2="9"/><line x1="14" y1="15" x2="21" y2="15"/><line x1="14" y1="20" x2="21" y2="20"/></IconSVG>;
        const TrendingUp = (p) => <IconSVG {...p}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></IconSVG>;
        const TrendingDown = (p) => <IconSVG {...p}><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></IconSVG>;
        const Activity = (p) => <IconSVG {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></IconSVG>;
        const Lightbulb = (p) => <IconSVG {...p}><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></IconSVG>;
        const Play = (p) => <IconSVG {...p}><polygon points="5 3 19 12 5 21 5 3"/></IconSVG>;
        const Pause = (p) => <IconSVG {...p}><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></IconSVG>;
        const Edit3 = (p) => <IconSVG {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></IconSVG>;

        // ==========================================
        // 主程式邏輯 (無人機計分系統)
        // ==========================================
        function App() {
          const [user, setUser] = useState(null);
          const [activeTab, setActiveTab] = useState('score');
          const [scoresData, setScoresData] = useState([]);
          const [notification, setNotification] = useState(null);

          const [playerName, setPlayerName] = useState('');
          const [searchName, setSearchName] = useState('');
          
          const [rankingCategory, setRankingCategory] = useState('finalScore');
          const [rankingViewMode, setRankingViewMode] = useState('list');
          
          const [isTimerRunning, setIsTimerRunning] = useState(false);
          const [isEditingTime, setIsEditingTime] = useState(false);
          const [timeInput, setTimeInput] = useState("");

          const initialFormState = {
            takeoff: false, obsA: false, obsB: false, obsC: false,
            obsD: false, obsE: false, obsF: false, obsG: false,
            landing: -1, deductTouchObs: 0, deductTouchGnd: 0, deductOutOfBounds: 0, timeUsed: 0
          };
          const [form, setForm] = useState(initialFormState);

          const [isPlayerDropdownOpen, setIsPlayerDropdownOpen] = useState(false);
          const [localPlayers, setLocalPlayers] = useState([]);
          const [hiddenPlayers, setHiddenPlayers] = useState([]);
          const [confirmDeleteId, setConfirmDeleteId] = useState(null);

          // Firebase 匿名登入
          useEffect(() => {
            if (!auth) return;
            signInAnonymously(auth).catch(err => console.error("Auth error:", err));
            const unsubscribe = onAuthStateChanged(auth, setUser);
            return () => unsubscribe();
          }, []);

          // Firebase 即時連線
          useEffect(() => {
            if (!user || !db) return;
            const scoresRef = collection(db, 'drone_scores_2026');

            const unsubscribe = onSnapshot(scoresRef, (snapshot) => {
              const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              data.sort((a, b) => {
                const timeA = a.timestamp?.seconds || 0;
                const timeB = b.timestamp?.seconds || 0;
                return timeB - timeA;
              });
              setScoresData(data);
            }, (error) => console.error("Firestore error:", error));

            return () => unsubscribe();
          }, [user]);

          // 高精度計時器
          useEffect(() => {
            let animationFrameId;
            let lastTime = Date.now();

            const tick = () => {
              const now = Date.now();
              const delta = (now - lastTime) / 1000;
              lastTime = now;

              setForm(prev => {
                let newTime = prev.timeUsed + delta;
                if (newTime >= 120) {
                  setIsTimerRunning(false);
                  return { ...prev, timeUsed: 120 };
                }
                return { ...prev, timeUsed: newTime };
              });

              if (isTimerRunning) animationFrameId = requestAnimationFrame(tick);
            };

            if (isTimerRunning) animationFrameId = requestAnimationFrame(tick);
            return () => cancelAnimationFrame(animationFrameId);
          }, [isTimerRunning]);

          const allPlayers = useMemo(() => {
            const dbPlayers = scoresData.map(s => s.playerName);
            return [...new Set([...dbPlayers, ...localPlayers])].filter(name => !hiddenPlayers.includes(name)).sort();
          }, [scoresData, localPlayers, hiddenPlayers]);

          const filteredPlayers = useMemo(() => {
            return allPlayers.filter(name => name.toLowerCase().includes(playerName.toLowerCase()));
          }, [allPlayers, playerName]);

          const calculatedResult = useMemo(() => {
            let baseScore = 0;
            const missingTasks = [];
            
            if (form.takeoff) baseScore += 10; else missingTasks.push('起飛自旋');
            if (form.obsA) baseScore += 10; else missingTasks.push('障礙A');
            if (form.obsB) baseScore += 10; else missingTasks.push('障礙B');
            if (form.obsC) baseScore += 15; else missingTasks.push('障礙C');
            if (form.obsD) baseScore += 5; else missingTasks.push('障礙D');
            if (form.obsE) baseScore += 15; else missingTasks.push('障礙E');
            if (form.obsF) baseScore += 15; else missingTasks.push('障礙F');
            if (form.obsG) baseScore += 5; else missingTasks.push('障礙G');
            
            const actualLandingScore = form.landing === -1 ? 0 : form.landing;
            baseScore += actualLandingScore;
            if (actualLandingScore === 0 || form.landing === -1) missingTasks.push('精準降落');

            const deductions = (form.deductTouchObs * 2) + (form.deductTouchGnd * 4) + (form.deductOutOfBounds * 8);
            const allCompleted = missingTasks.length === 0 && actualLandingScore > 0;
            const flooredTimeUsed = Math.floor(form.timeUsed);
            const timeBonus = allCompleted ? Math.max(0, 120 - flooredTimeUsed) : 0;
            const finalScore = Math.max(0, baseScore - deductions + timeBonus);

            const improvements = [];
            if (deductions >= 16) {
              improvements.push('⚠️ 嚴重失控：頻繁碰壁或出界。QZ-B130 機身僅重 100g，極易受賽場冷氣風向影響。請善用遙控器的「低速檔」進行精細操作，重新練習「四向懸停」。');
            } else {
              if (form.deductTouchObs > 0) improvements.push('🔍 避障細節：撞擊仍會扣分且破壞機身姿態。穿越狹窄障礙時，強烈建議利用遙控器切換至「低速模式」，以微小推桿幅度滑行通過。');
              if (form.deductTouchGnd > 0) improvements.push('⬆️ 高度控制：機體觸地。QZ-B130 在連續轉彎或急煞時仍會掉高度。請在推動方向桿時，微補一點油門 (Throttle)。');
              if (form.deductOutOfBounds > 0) improvements.push('📍 空間感知：選手超出操控區。若常迷失方向，平時訓練可嘗試開啟「無頭模式」輔助空間認知。請保持雙腳不動，利用轉腰和視線跟隨。');
            }

            if (!allCompleted) {
              if (missingTasks.includes('障礙E') || missingTasks.includes('障礙F') || missingTasks.includes('障礙C')) {
                 improvements.push(`🎯 難點突破：漏掉高分區（${missingTasks.filter(t => ['障礙C', '障礙E', '障礙F'].includes(t)).join('、')}）。QZ-B130 軸距僅 125mm，絕對能輕鬆穿過。請分拆動作，專項練習「定高直線飛行」。`);
              } else if (missingTasks.length > 0) {
                 improvements.push(`📋 基礎鞏固：漏掉了 ${missingTasks.slice(0, 2).join('、')}。請熟記賽道順序，利用 QZ-B130 的續航時間多做模擬飛行。`);
              }
            } else {
              if (form.timeUsed > 100) {
                improvements.push('⏱️ 提升效率：任務全解但耗時偏長。在 A、B、D 等間距較遠的障礙區，可大膽切換至「高速模式」直線衝刺，靠近障礙再切回低速。');
              } else if (form.timeUsed < 60) {
                improvements.push('⚡ 競速潛力：速度極佳！說明你已完全掌握 QZ-B130 的操控特性，建議開始練習進階的「側滑過彎」技術以挑戰極限時間。');
              }
            }
            
            if (actualLandingScore < 15 && actualLandingScore > 0) {
              improvements.push('🎯 降落微調：降落偏離靶心。比賽中請勿依賴一鍵降落。請飛到停機坪正上方 0.5 米處懸停 2 秒，手動緩慢收油門直至觸地。');
            }

            if (improvements.length === 0) {
              improvements.push('🌟 完美表現：基礎紮實，走線精準！這是一次極具教科書水準的滿分飛行。');
            }

            return { baseScore, deductions, timeBonus, finalScore, allCompleted, improvements, flooredTimeUsed };
          }, [form]);

          const rankingOptions = [
            { id: 'finalScore', label: '總分最高排名', suffix: 'pts' },
            { id: 'baseScore', label: '基礎得分排名', suffix: 'pts' },
            { id: 'timeBonus', label: '時間獎勵排名', suffix: 'pts' },
            { id: 'deductions', label: '失誤最少排名', suffix: 'pts' },
          ];

          const rankedData = useMemo(() => {
            if (!scoresData.length) return [];
            const playerBest = {};

            scoresData.forEach(record => {
              const name = record.playerName;
              const res = record.results;
              let val;
              if (rankingCategory === 'finalScore') val = res.finalScore;
              else if (rankingCategory === 'baseScore') val = res.baseScore;
              else if (rankingCategory === 'timeBonus') val = res.timeBonus;
              else if (rankingCategory === 'deductions') val = res.deductions;

              if (!playerBest[name]) {
                playerBest[name] = { name, val, record };
              } else {
                if (rankingCategory === 'deductions') {
                  if (val < playerBest[name].val) playerBest[name] = { name, val, record };
                } else {
                  if (val > playerBest[name].val) playerBest[name] = { name, val, record };
                }
              }
            });

            const sorted = Object.values(playerBest).sort((a, b) => {
              if (rankingCategory === 'deductions') return a.val - b.val;
              return b.val - a.val;
            });

            let currentRank = 1;
            let previousVal = null;
            return sorted.map((item, index) => {
              if (previousVal !== null && item.val !== previousVal) {
                currentRank = index + 1;
              }
              previousVal = item.val;
              return { ...item, rank: currentRank };
            });
          }, [scoresData, rankingCategory]);

          const filteredHistory = useMemo(() => {
            if (!searchName.trim()) return [];
            return scoresData.filter(item => 
              item.playerName.toLowerCase().includes(searchName.trim().toLowerCase())
            );
          }, [searchName, scoresData]);

          const stats = useMemo(() => {
            if (filteredHistory.length === 0) return { avg: 0, max: 0, count: 0 };
            const max = Math.max(...filteredHistory.map(item => item.results.finalScore));
            const sum = filteredHistory.reduce((acc, item) => acc + item.results.finalScore, 0);
            return { avg: (sum / filteredHistory.length).toFixed(1), max, count: filteredHistory.length };
          }, [filteredHistory]);

          const expertProgressAnalysis = useMemo(() => {
            if (filteredHistory.length < 2) return null;
            const targetPlayer = filteredHistory[0].playerName;
            const playerRecords = filteredHistory.filter(r => r.playerName === targetPlayer);
            if (playerRecords.length < 2) return null;

            const latest = playerRecords[0].results;
            const previous = playerRecords[1].results;
            const latestTime = playerRecords[0].scoreData.timeUsed;
            const prevTime = playerRecords[1].scoreData.timeUsed;

            const scoreDiff = latest.finalScore - previous.finalScore;
            const deductionDiff = latest.deductions - previous.deductions;
            const timeDiff = latestTime - prevTime;

            let title = "", statusColor = "", isUp = false, isDown = false;
            let comments = [];

            if (scoreDiff > 0) {
              isUp = true; title = `狀態火熱：成績突破！ (進步 ${scoreDiff} 分)`; statusColor = "bg-emerald-50 border-emerald-200 text-emerald-900";
              comments.push(`太棒了！相較於上一次的飛行，你的總分躍升了 ${scoreDiff} 分。`);
              if (deductionDiff < 0) comments.push(`🛡️ 穩定度大增：失誤扣分減少了 ${Math.abs(deductionDiff)} 分。可見你已經開始適應 QZ-B130 的微調手感。`);
              if (timeDiff < 0 && latest.allCompleted) comments.push(`⚡ 速度突破：完賽時間縮短了 ${Math.abs(timeDiff).toFixed(2)} 秒。善用了無人機的高速模式切換！`);
              if (deductionDiff >= 0 && timeDiff >= 0) comments.push(`🎯 任務完成度提升：這次成功挑戰了更多高難度障礙，請繼續保持。`);
            } else if (scoreDiff < 0) {
              isDown = true; title = `遇到瓶頸：成績回落 (退步 ${Math.abs(scoreDiff)} 分)`; statusColor = "bg-red-50 border-red-200 text-red-900";
              comments.push(`這次的總分比上次少了 ${Math.abs(scoreDiff)} 分。別灰心，找出原因最重要。`);
              if (deductionDiff > 0) comments.push(`💥 失誤增加：這次的失誤扣分多了 ${deductionDiff} 分。建議退回「低速檔」，找回微動推桿的肌肉記憶。`);
              if (timeDiff > 0) comments.push(`⏳ 節奏猶豫：比起上次多花了 ${timeDiff.toFixed(2)} 秒。試著在起飛前於腦海中先畫出完美的飛行弧線。`);
              if (!latest.allCompleted && previous.allCompleted) comments.push(`❌ 錯失全解：這次未能完成所有任務。切忌為了追求極限速度而犧牲了基礎障礙。`);
            } else {
              title = `狀態平穩：成績持平`; statusColor = "bg-blue-50 border-blue-200 text-blue-900";
              comments.push(`這次成績與上次完全相同，展現了你極高的心理素質。`);
              if (latest.finalScore > 80) comments.push(`🔥 高手過招：精算每一個彎道的入彎角度，完美利用輕巧慣性滑行過彎。`);
              else comments.push(`💡 突破建議：試著先從「零失誤」開始要求自己，並確保降落在白圈內。`);
            }
            return { title, statusColor, isUp, isDown, comments, playerName: targetPlayer };
          }, [filteredHistory]);

          const formatDate = (timestamp) => {
            if (!timestamp) return '剛剛';
            const d = new Date(timestamp.seconds * 1000);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const hours = String(d.getHours()).padStart(2, '0');
            const minutes = String(d.getMinutes()).padStart(2, '0');
            return `${year}/${month}/${day} ${hours}:${minutes}`;
          };

          const handleToggle = (field) => setForm(prev => ({ ...prev, [field]: !prev[field] }));

                                <div className="text-sm font-semibold text-slate-500 uppercase">扣分 <span className="text-lg font-black text-slate-400 ml-1.5">-{item.results.deductions}</span></div>
                                <div className="text-sm font-semibold text-slate-500 uppercase">用時 <span className="text-lg font-black text-slate-900 ml-1.5">{Number(item.scoreData.timeUsed).toFixed(2)}s</span></div>
                                <div className="text-sm font-semibold text-slate-500 uppercase">獎勵 <span className="text-lg font-black text-emerald-500 ml-1.5">+{item.results.timeBonus}</span></div>
                              </div>
                              <div className="bg-amber-50/50 rounded-2xl p-5 border border-amber-100/50">
                                <div className="text-xs font-bold tracking-widest text-amber-600 uppercase mb-3 flex items-center gap-1.5"><AlertCircle className="w-4 h-4" /> 該次專家點評</div>
                                <ul className="space-y-2.5">{item.results.improvements.map((imp, i) => <li key={i} className="text-sm text-slate-700 flex items-start gap-2.5 leading-relaxed font-medium">{imp}</li>)}</ul>
                              </div>
                            </div>
                          ))}
                        </div>
                      </>
                    )}
                    {searchName.trim() !== '' && filteredHistory.length === 0 && (
                      <div className="text-center py-24 bg-white rounded-3xl border border-slate-200/60 shadow-sm"><User className="w-12 h-12 text-slate-200 mx-auto mb-4" /><p className="text-slate-400 text-sm font-bold tracking-wide">找不到相關紀錄</p></div>
                    )}
                    {searchName.trim() === '' && (
                      <div className="text-center py-24"><div className="w-16 h-16 bg-white rounded-2xl shadow-sm border border-slate-100 flex items-center justify-center mx-auto mb-5 transform rotate-3"><History className="w-8 h-8 text-slate-300" /></div><p className="text-slate-400 text-sm font-bold tracking-wide">請輸入姓名以查閱紀錄與數據</p></div>
                    )}
                  </div>
                )}

                {activeTab === 'ranking' && (
                  <div className="space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 bg-white p-6 sm:p-8 rounded-3xl border border-slate-200/60 shadow-sm">
                      <div><h2 className="text-xl font-bold text-slate-900 tracking-tight">榮譽榜</h2><p className="text-xs font-medium text-slate-500 mt-1.5">系統將自動選取每位選手最佳的一次紀錄參與排名</p></div>
                      <div className="flex flex-col sm:flex-row gap-4 w-full md:w-auto">
                        <div className="flex bg-slate-100 p-1.5 rounded-2xl w-full sm:w-auto shadow-inner border border-slate-200/50">
                          <button onClick={() => setRankingViewMode('list')} className={`flex-1 sm:flex-none flex items-center justify-center gap-2 px-5 py-2.5 text-sm font-bold rounded-xl transition-all ${rankingViewMode === 'list' ? 'bg-white text-slate-900 shadow-sm scale-[0.98]' : 'text-slate-500 hover:text-slate-700'}`}><LayoutList className="w-4 h-4" /> 清單</button>
                          <button onClick={() => setRankingViewMode('chart')} className={`flex-1 sm:flex-none flex items-center justify-center gap-2 px-5 py-2.5 text-sm font-bold rounded-xl transition-all ${rankingViewMode === 'chart' ? 'bg-white text-slate-900 shadow-sm scale-[0.98]' : 'text-slate-500 hover:text-slate-700'}`}><BarChart2 className="w-4 h-4" /> 圖表</button>
                        </div>
                        <div className="relative inline-flex w-full sm:w-auto">
                          <ListOrdered className="absolute left-5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none" />
                          <select value={rankingCategory} onChange={(e) => setRankingCategory(e.target.value)} className="w-full sm:w-auto appearance-none bg-slate-50 border border-slate-200 text-slate-900 py-3 pl-12 pr-12 rounded-2xl text-sm font-bold outline-none focus:bg-white focus:border-slate-400 focus:ring-4 focus:ring-slate-100 transition-all cursor-pointer shadow-sm">
                            {rankingOptions.map(opt => <option key={opt.id} value={opt.id}>{opt.label}</option>)}
                          </select>
                          <ChevronDown className="absolute right-5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none" />
                        </div>
                      </div>
                    </div>
                    {rankedData.length > 0 ? (
                      <div className="space-y-4">
                        {(() => {
                          const maxChartVal = Math.max(...rankedData.map(d => d.val), 1);
                          return rankedData.map((player) => {
                            const widthPct = (player.val / maxChartVal) * 100;
                            const isDeductions = rankingCategory === 'deductions';
                            let barColor = 'bg-slate-900';
                            if (isDeductions) barColor = 'bg-red-400';
                            else if (player.rank === 1) barColor = 'bg-amber-400';
                            else if (player.rank === 2) barColor = 'bg-slate-400';
                            else if (player.rank === 3) barColor = 'bg-orange-400';

                            if (rankingViewMode === 'list') {
                              return (
                                <div key={player.name} className="relative bg-white p-6 sm:p-8 rounded-3xl border border-slate-200/60 shadow-sm hover:shadow-md transition-shadow overflow-hidden group">
                                  <div className="absolute top-0 left-0 h-full bg-slate-50 w-full opacity-50" />
                                  <div className={`absolute top-0 left-0 h-full opacity-[0.08] transition-all duration-1000 ease-out origin-left ${barColor}`} style={{ width: `${widthPct}%` }} />
                                  <div className={`absolute bottom-0 left-0 h-1.5 transition-all duration-1000 ease-out ${barColor}`} style={{ width: `${widthPct}%` }} />
                                  <div className="flex items-center justify-between relative z-10">
                                    <div className="flex items-center gap-6"><RankBadge rank={player.rank} /><div><div className="font-bold text-xl text-slate-900">{player.name}</div><div className="text-xs font-semibold text-slate-400 font-mono mt-1">{formatDate(player.record.timestamp)}</div></div></div>
                                    <div className="flex flex-col items-end"><div className="flex items-baseline gap-2"><span className="text-3xl sm:text-4xl font-black tracking-tighter text-slate-900">{player.val}</span><span className="text-xs font-bold text-slate-400 uppercase">pts</span></div></div>
                                  </div>
                                </div>
                              );
                            }
                            const res = player.record.results;
                            const chartMaxScale = 235; 
                            const basePct = (res.baseScore / chartMaxScale) * 100;
                            const bonusPct = (res.timeBonus / chartMaxScale) * 100;
                            return (
                              <div key={player.name} className="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200/60 shadow-sm hover:shadow-md transition-shadow">
                                 <div className="flex items-center justify-between mb-5">
                                   <div className="flex items-center gap-4"><div className="text-sm font-black text-slate-300 w-6 text-center">#{player.rank}</div><div className="font-bold text-lg text-slate-900">{player.name}</div></div>
                                   <div className="font-mono text-xl font-black text-slate-900">{player.val} <span className="text-xs text-slate-400 uppercase">PTS</span></div>
                                 </div>
                                 <div className="relative h-5 bg-slate-100 rounded-full overflow-hidden flex mb-4 shadow-inner">
                                    <div className="bg-blue-500 h-full transition-all duration-1000" style={{ width: `${basePct}%` }} title="基礎分" />
                                    <div className="bg-emerald-400 h-full transition-all duration-1000 border-l border-white/20" style={{ width: `${bonusPct}%` }} title="時間獎勵" />
                                 </div>
                                 <div className="flex flex-wrap justify-between text-xs font-bold gap-3">
                                   <div className="flex gap-5">
                                     <div className="flex items-center gap-2 text-slate-500"><div className="w-2.5 h-2.5 rounded-full bg-blue-500 shadow-sm" /> 基礎: {res.baseScore}</div>
                                     <div className="flex items-center gap-2 text-slate-500"><div className="w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-sm" /> 獎勵: +{res.timeBonus}</div>
                                   </div>
                                   <div className="text-red-500 bg-red-50 px-3 py-1 rounded-lg border border-red-100">失誤: -{res.deductions}</div>
                                 </div>
                              </div>
                            );
                          });
                        })()}
                      </div>
                    ) : (
                      <div className="text-center py-24 bg-white rounded-3xl border border-slate-200/60 shadow-sm border-dashed"><BarChart3 className="w-12 h-12 text-slate-200 mx-auto mb-4" /><p className="text-slate-400 text-sm font-bold tracking-wide">目前尚無任何比賽成績可供排名</p></div>
                    )}
                  </div>
                )}
              </main>
              
              <footer className="text-center py-8 text-xs text-slate-400 font-bold tracking-widest leading-relaxed">
                yhk@caswcmc<br />2026
              </footer>
            </div>
          );
        }

        const RankBadge = ({ rank }) => {
          if (rank === 1) return <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-amber-200 to-amber-400 text-amber-900 flex items-center justify-center font-black shadow-lg shadow-amber-400/20 border border-amber-300"><Medal className="w-6 h-6" /></div>;
          if (rank === 2) return <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-slate-200 to-slate-300 text-slate-700 flex items-center justify-center font-black shadow-lg shadow-slate-300/20 border border-slate-300">2</div>;
          if (rank === 3) return <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-orange-200 to-orange-300 text-orange-800 flex items-center justify-center font-black shadow-lg shadow-orange-300/20 border border-orange-300">3</div>;
          return <div className="w-12 h-12 rounded-2xl bg-slate-50 border border-slate-200 text-slate-400 flex items-center justify-center font-black">{rank}</div>;
        };

        const ToggleBtn = ({ label, val, onClick, pts }) => (
          <button onClick={onClick} className={`group flex flex-col items-center justify-center p-5 rounded-2xl border transition-all duration-300 active:scale-95 ${val ? 'bg-slate-900 border-slate-900 text-white shadow-lg shadow-slate-900/20' : 'bg-white border-slate-200 text-slate-500 hover:border-slate-300 hover:bg-slate-50 hover:shadow-sm'}`}>
            <span className="font-bold text-sm mb-2.5">{label}</span>
            <span className={`text-[10px] uppercase tracking-widest px-2.5 py-1 rounded-full font-black transition-colors ${val ? 'bg-slate-800 text-slate-300' : 'bg-slate-100 text-slate-400 group-hover:bg-slate-200'}`}>+{pts} PTS</span>
          </button>
        );

        const RadioBtn = ({ label, pts, active, onClick }) => (
          <button onClick={onClick} className={`flex items-center justify-between p-5 rounded-2xl border transition-all duration-300 active:scale-[0.98] ${active ? 'bg-slate-900 border-slate-900 text-white shadow-lg shadow-slate-900/20' : 'bg-white border-slate-200 text-slate-500 hover:border-slate-300 hover:bg-slate-50 hover:shadow-sm'}`}>
            <div className="flex items-center gap-3">
              <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center transition-colors ${active ? 'border-white' : 'border-slate-300'}`}>{active && <div className="w-2 h-2 bg-white rounded-full animate-in zoom-in duration-200" />}</div>
              <span className="font-bold text-sm">{label}</span>
            </div>
            <span className={`text-[10px] uppercase tracking-widest font-black ${active ? 'text-slate-400' : 'text-slate-400'}`}>+{pts}</span>
          </button>
        );

        const Counter = ({ label, val, onInc, onDec, sub }) => (
          <div className="flex items-center justify-between bg-slate-50 p-5 rounded-2xl border border-slate-100 shadow-inner">
            <div><div className="font-bold text-slate-900 text-sm mb-1">{label}</div><div className="text-xs font-bold text-slate-400 font-mono tracking-tighter">{sub} pts</div></div>
            <div className="flex items-center gap-5">
              <button onClick={onDec} className="w-9 h-9 rounded-xl bg-white border border-slate-200 flex items-center justify-center text-slate-400 hover:text-slate-900 hover:border-slate-300 transition-all shadow-sm active:scale-95"><Minus className="w-4 h-4" /></button>
              <div className="w-6 text-center font-black text-lg tabular-nums">{val}</div>
              <button onClick={onInc} className="w-9 h-9 rounded-xl bg-slate-900 border border-slate-900 flex items-center justify-center text-white hover:bg-slate-800 transition-all shadow-md shadow-slate-900/20 active:scale-95"><Plus className="w-4 h-4" /></button>
            </div>
          </div>
        );

        const StatCard = ({ label, value }) => (
          <div className="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200/60 shadow-sm flex flex-col justify-center">
            <div className="text-xs font-bold tracking-widest text-slate-400 uppercase mb-3">{label}</div>
            <div className="text-4xl sm:text-5xl font-black tracking-tighter text-slate-900 drop-shadow-sm">{value}</div>
          </div>
        );

        const TrendChart = ({ data }) => {
          if (!data || data.length < 2) return null;
          const chartData = [...data].reverse(); 
          const w = 800; const h = 260; const padX = 50; const padY = 60;
          const maxScore = Math.max(100, ...chartData.map(d => d.results.finalScore)) + 20;
          const points = chartData.map((d, i) => {
            const x = padX + (i / (chartData.length - 1)) * (w - 2 * padX);
            const y = h - padY - (d.results.finalScore / maxScore) * (h - 2 * padY);
            return { x, y, score: d.results.finalScore };
          });
          const pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
          const areaD = `${pathD} L ${points[points.length - 1].x} ${h - padY} L ${points[0].x} ${h - padY} Z`;

          return (
            <div className="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200/60 shadow-sm mt-4 mb-8 overflow-hidden">
              <div className="flex items-center gap-3 mb-8">
                <div className="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center text-slate-600 border border-slate-200 shadow-sm"><TrendingUp className="w-5 h-5" /></div>
                <h3 className="text-sm font-bold tracking-widest text-slate-800 uppercase">表現趨勢折線圖</h3>
              </div>
              <div className="w-full overflow-x-auto hide-scrollbar pb-2">
                <svg viewBox={`0 0 ${w} ${h}`} className="w-full min-w-[600px] h-auto text-slate-900 drop-shadow-sm">
                  <line x1={padX} y1={padY} x2={w-padX} y2={padY} stroke="#f1f5f9" strokeWidth="2" strokeDasharray="6 6" />
                  <line x1={padX} y1={(h)/2} x2={w-padX} y2={(h)/2} stroke="#f1f5f9" strokeWidth="2" strokeDasharray="6 6" />
                  <line x1={padX} y1={h-padY} x2={w-padX} y2={h-padY} stroke="#e2e8f0" strokeWidth="3" strokeLinecap="round" />
                  <path d={areaD} fill="url(#gradient)" opacity="0.2" />
                  <path d={pathD} fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" />
                  {points.map((p, i) => (
                    <g key={i} className="group cursor-pointer">
                      <circle cx={p.x} cy={p.y} r="6" fill="white" stroke="currentColor" strokeWidth="3" className="transition-all duration-300 hover:r-8" />
                      <text x={p.x} y={p.y - 18} textAnchor="middle" fontSize="16" fontWeight="800" fill="currentColor">{p.score}</text>
                      <text x={p.x} y={h - padY + 28} textAnchor="middle" fontSize="12" fill="#94a3b8" fontWeight="700" letterSpacing="0.05em">第 {i + 1} 次</text>
                    </g>
                  ))}
                  <defs>
                    <linearGradient id="gradient" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stopColor="currentColor" stopOpacity="1" />
                      <stop offset="100%" stopColor="currentColor" stopOpacity="0" />
                    </linearGradient>
                  </defs>
                </svg>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <style>
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</body>
</html>
